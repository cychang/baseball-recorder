<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baseball Record Manager</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand">BASEBALL TRACKER</div>
        <div class="badge" id="dataSourceBadge">Local File</div>
      </header>

      <nav class="nav">
        <button data-target="teamsPage">球隊</button>
        <button data-target="playersPage">球員</button>
        <button data-target="tournamentsPage">盃賽</button>
        <button class="active" data-target="gamesPage">比賽</button>
        <button data-target="scorekeeperPage">紀錄</button>
      </nav>

      <section id="scorekeeperPage" class="page">
        <div class="layout">
          <div class="card panel">
            <h2>紀錄</h2>
            <div id="scorekeeperSelector" class="filter-row scorekeeper-selector">
              <select id="activeGameSelect">
                <option value="">選擇比賽</option>
              </select>
            </div>
            <div id="scorekeeperPanel" class="scorekeeper-panel" hidden>
              <div class="row-between">
                <div>
                  <h3 id="scorekeeperTitle" style="margin: 0;">比賽記錄</h3>
                  <div id="scorekeeperMeta" style="margin-top: 6px; color: var(--muted);"></div>
                </div>
                <div class="scorekeeper-header-actions">
                  <button class="tiny-btn danger" id="finishGameBtn" type="button" data-finish-game>比賽結束</button>
                  <button class="tiny-btn" id="closeScorekeeperBtn" type="button">關閉</button>
                </div>
              </div>
              <div id="traditionalScoreboard" class="traditional-scoreboard">
                <div id="lineScoreTable" class="line-score-table"></div>
                <div class="scorebug">
                  <div id="matchupPanel" class="matchup-box"></div>
                  <div id="fieldDiamond" class="field-diamond" aria-label="壘包狀況">
                    <button class="base-indicator second" type="button" data-base-indicator="second" data-preview-base-indicator="second" data-base-drop-target="second" data-runner-target="second" aria-label="二壘"></button>
                    <button class="base-indicator third" type="button" data-base-indicator="third" data-preview-base-indicator="third" data-base-drop-target="third" data-runner-target="third" aria-label="三壘"></button>
                    <button class="base-indicator first" type="button" data-base-indicator="first" data-preview-base-indicator="first" data-base-drop-target="first" data-runner-target="first" aria-label="一壘"></button>
                    <button class="diamond-target home-score-target" type="button" data-home-score-target data-runner-target="home">HOME 得分</button>
                    <button class="diamond-target out-drop-target" type="button" data-out-drop-target data-runner-target="out">出局</button>
                    <div class="batter-zone">打者區</div>
                  </div>
                  <div id="countPanel" class="count-panel"></div>
                </div>
              </div>
              <form id="eventForm" class="event-form">
                <input name="balls" type="hidden" value="0" />
                <input name="strikes" type="hidden" value="0" />
                <input name="eventType" type="hidden" value="PLATE_APPEARANCE" />
                <input name="result" type="hidden" value="" />
                <input name="fielderPosition" type="hidden" value="" />
                <input name="runs" type="hidden" value="0" />
                <input name="outs" type="hidden" value="0" />
                <section class="pitch-panel" aria-label="Pitch 記錄">
                  <div class="pitch-panel-title">Pitch（不需送出）</div>
                  <div class="pitch-actions">
                    <button class="tiny-btn secondary" type="button" data-pitch-action="BALL">壞球 Ball</button>
                    <button class="tiny-btn secondary" type="button" data-pitch-action="CALLED_STRIKE">看著好球</button>
                    <button class="tiny-btn secondary" type="button" data-pitch-action="SWINGING_STRIKE">揮空</button>
                    <button class="tiny-btn secondary" type="button" data-pitch-action="FOUL">界外</button>
                  </div>
                </section>
                <section class="play-event-panel" aria-label="Play 結果">
                  <div class="event-submit-bar">
                    <span class="event-section-label">Play 結果</span>
                    <button class="event-submit tiny-btn" type="submit">記錄 Play</button>
                  </div>
                  <div class="runner-event-actions" aria-label="壘上事件">
                    <span class="event-section-label">壘上事件</span>
                    <button class="tiny-btn secondary" type="button" data-runner-event-action="WILD_PITCH">暴投</button>
                    <button class="tiny-btn secondary" type="button" data-runner-event-action="BALK">投手犯規</button>
                    <button class="tiny-btn secondary" type="button" data-runner-event-action="STOLEN_BASE">盜壘</button>
                    <button class="tiny-btn secondary" type="button" data-runner-event-action="PICKOFF">牽制出局</button>
                  </div>
                  <div class="event-section-label">打擊事件</div>
                  <div class="result-actions" aria-label="打席結果">
                    <button class="tiny-btn secondary active" type="button" data-ready-action>準備</button>
                    <button class="tiny-btn secondary" type="button" data-result-action="SINGLE">一安</button>
                    <button class="tiny-btn secondary" type="button" data-result-action="DOUBLE">二安</button>
                    <button class="tiny-btn secondary" type="button" data-result-action="TRIPLE">三安</button>
                    <button class="tiny-btn secondary" type="button" data-result-action="HOME_RUN">全壘打</button>
                    <button class="tiny-btn secondary" type="button" data-result-action="WALK">保送</button>
                    <button class="tiny-btn secondary" type="button" data-result-action="HIT_BY_PITCH">觸身</button>
                    <button class="tiny-btn secondary" type="button" data-result-action="STRIKEOUT">三振</button>
                    <button class="tiny-btn secondary" type="button" data-result-action="DROPPED_THIRD_STRIKE">不死三振</button>
                    <button class="tiny-btn secondary" type="button" data-result-action="GROUNDOUT">滾地出局</button>
                    <button class="tiny-btn secondary" type="button" data-result-action="FLYOUT">飛球出局</button>
                    <button class="tiny-btn secondary" type="button" data-result-action="DOUBLE_PLAY">雙殺</button>
                    <button class="tiny-btn secondary" type="button" data-result-action="ERROR">失誤</button>
                    <button class="tiny-btn secondary" type="button" data-result-action="FIELDERS_CHOICE">野選</button>
                    <button class="tiny-btn secondary" type="button" data-result-action="SACRIFICE">犧牲打</button>
                  </div>
                  <div id="fielderPositionPanel" class="fielder-position-panel" aria-label="守備位置" hidden>
                    <span class="event-section-label">守備位置</span>
                    <div class="fielder-position-actions">
                      <button class="tiny-btn secondary" type="button" data-fielder-position="P">投</button>
                      <button class="tiny-btn secondary" type="button" data-fielder-position="C">捕</button>
                      <button class="tiny-btn secondary" type="button" data-fielder-position="1B">一</button>
                      <button class="tiny-btn secondary" type="button" data-fielder-position="2B">二</button>
                      <button class="tiny-btn secondary" type="button" data-fielder-position="3B">三</button>
                      <button class="tiny-btn secondary" type="button" data-fielder-position="SS">遊</button>
                      <button class="tiny-btn secondary" type="button" data-fielder-position="LF">左</button>
                      <button class="tiny-btn secondary" type="button" data-fielder-position="CF">中</button>
                      <button class="tiny-btn secondary" type="button" data-fielder-position="RF">右</button>
                    </div>
                  </div>
                </section>
              </form>
              <form id="lineupForm" class="lineup-form">
                <div class="row-between lineup-summary">
                  <div>
                    <h3 style="margin: 0;">Order / 換人</h3>
                    <div style="margin-top: 6px; color: var(--muted);">需要排打序或換人時再展開；紀錄會自動帶局半、打者與守方投手。</div>
                  </div>
                  <button class="tiny-btn secondary" id="toggleLineupBtn" type="button" aria-expanded="false" aria-controls="lineupBody">展開 Order 單</button>
                </div>
                <div id="lineupBody" class="lineup-body" hidden>
                  <div id="lineupEditor" class="lineup-grid"></div>
                  <button class="tiny-btn" type="submit">儲存 Order 單</button>
                </div>
              </form>
            </div>
          </div>
          <div class="card panel">
            <div class="row-between">
              <h2>Play-by-play</h2>
              <button class="tiny-btn secondary" type="button" data-undo-last-event disabled>退回上一筆</button>
            </div>
            <div id="eventTimeline" class="event-timeline">
              <div class="mini-card">選擇比賽後開始記錄</div>
            </div>
          </div>
        </div>
      </section>

      <section id="teamsPage" class="page">
        <div class="card panel">
          <div class="row-between">
            <h2>球隊一覽</h2>
            <button class="tiny-btn" type="button" data-create="team">新增球隊</button>
          </div>
          <div class="filter-row">
            <input id="teamSearchInput" type="text" placeholder="搜尋球隊" />
          </div>
          <div id="teamList"></div>
        </div>
      </section>

      <section id="playersPage" class="page">
        <div class="card panel">
          <div class="row-between">
            <h2>球員列表</h2>
            <button class="tiny-btn" type="button" data-create="player">新增球員</button>
          </div>
          <div class="filter-row">
            <input id="playerSearchInput" type="text" placeholder="搜尋球員" />
          </div>
          <div id="playerList"></div>
        </div>
      </section>

      <section id="tournamentsPage" class="page">
        <div class="card panel">
          <div class="row-between">
            <h2>盃賽列表</h2>
            <button class="tiny-btn" type="button" data-create="tournament">新增盃賽</button>
          </div>
          <div class="filter-row">
            <input id="tournamentSearchInput" type="text" placeholder="搜尋盃賽" />
          </div>
          <div id="tournamentList"></div>
        </div>
      </section>

      <section id="gamesPage" class="page active">
        <div class="card panel">
          <div class="row-between">
            <h2>比賽列表</h2>
            <button class="tiny-btn" type="button" data-create="game">新增比賽</button>
          </div>
          <div id="gamesListDetail"></div>
        </div>
      </section>

      <section id="settingsPage" class="page">
        <div class="card panel">
          <h2>資料設定</h2>
          <div class="status-box" id="configStatus">載入中...</div>
          <div style="margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap;">
            <button class="secondary" id="resetDemoBtn" type="button">重置 Demo 資料</button>
          </div>
          <p style="color: var(--muted); line-height: 1.7; margin-top: 18px;">
            現在的資料模型為：球隊 / 球員 / 盃賽 / 比賽 / 比賽事件。資料會存放在本地 data/baseball.db，方便你本地開發與測試。
          </p>
        </div>
      </section>
    </div>

    <div id="editModal" class="modal-backdrop" aria-hidden="true">
      <div class="modal">
        <button type="button" class="close-btn" id="closeModalBtn">關閉</button>
        <h3 id="modalTitle">編輯資料</h3>
        <form id="editForm"></form>
      </div>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
